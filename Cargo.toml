[workspace]
resolver = "2"
members = ["crates/voidnet-core", "crates/voidnet-sim", "crates/voidnet-ffi"]
exclude = ["spike", "fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
panic = "abort"
