[package]
name = "voidnet_crypto_probe"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
siphasher = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["heapless"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
